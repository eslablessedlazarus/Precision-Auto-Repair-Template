  <head>

    <meta charset="UTF-8">

    <meta name="description" content="Precision Auto Repair is Nigeria's vibrant mechanic workshop, specializing in succlent roasted chicken flavorful shawarma, and sizzling suya. Experience the taste of Nigeria's finest grilled dishes and more, prepared fresh for purchase or pickup.">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="stylesheet" href="style.css">
    
    <title>Appointment Form - Precision Auto Repairs</title>
  </head>


  <body>

    <header>

      <h1>Precision Auto Repairs</h1>

      <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
      </nav>

    </header>

    <main>

      <section id="#appointment-form">

       <h2>Book an Appointment</h2>

       <p>If our booking list is currently full, please use the form below to schedule your appointment and we’ll get back to you as soon as possible.</p>

        <form action="#" method="post">

         <label for="name">Full Name:</label><br />

         <input type="text" id="name" name="name" required><br /><br />



         <label for="email">Email:</label><br />

         <input type="email" id="email" name="email" required><br /><br />



         <label for="phone">Phone Number:</label><br />

         <input type="tel" id="phone" name="phone" required><br /><br />



         <label for="service">Service Required:</label><br />

          <select id="service" name="service" required>

           <option value="">Select a service</option>

           <option value="diagnostics">General vehicle diagnostics and inspections</option>

           <option value="engine">Engine repairs and rebuilding</option>

           <option value="oil-change">Oil changes and routine maintenance</option>

           <option value="brakes">Brake system repairs and replacements</option>

           <option value="suspension">Suspension and steering repairs</option>

           <option value="transmission">Transmission servicing and repairs</option>

           <option value="electrical">Electrical system diagnostics and repairs</option>

           <option value="ac">Air conditioning repairs and servicing</option>

           <option value="battery">Battery checks and replacements</option>

           <option value="tyres">Tyre rotations, balancing, and alignment</option>

           <option value="exhaust">Exhaust system repairs</option>

           <option value="cooling">Cooling system servicing</option>

           <option value="fuel">Fuel system maintenance and repairs</option>

           <option value="bodywork">Welding and bodywork repairs</option>

           <option value="detailing">Car washing and detailing</option>

          </select><br /><br />



         <label for="date">Preferred Date:</label><br />

         <input type="date" id="date" name="date" required><br /><br />



         <label for="time">Preferred Time:</label><br />

         <input type="time" id="time" name="time" required><br /><br />



         <label for="message">Additional Information:</label><br />

         <textarea id="message" name="message" rows="5"></textarea><br /><br />



         <button type="submit">Request Appointment</button>

        </form>

      </section>

    </main>



    <footer>

     <p>&copy;2025 Precision Auto Repairs</p>

    </footer>

    
  </body>
</html>
